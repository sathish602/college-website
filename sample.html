<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timing</title>
    <link rel="stylesheet" href="sample.css">
</head>
<body>
    <div class="box">
        <h1 style="color: red;">Hurry! This Exclusive Offer Ends Soon</h1>
        <p>Don't miss out on our limited-edition collection.Once it's gone,it's gone forever!</p>
        <div class="one">975<span class="day">DAYS</span> </div>
        <div class="two" >08<span class="hours">HOURS</span></div>
        <div class="three" >21<span class="min">MINUTES</span></div>
        <div class="four" >19<span class="sec">SECONDS</span></div>
        <p><button class="but" >Claim Your Deal</button></p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create an Account</title>
    <link rel="stylesheet" href="create.css">
</head>
<body>
    <div class="a">
       <h2 class="l"> Create Your Account</h2>
       <p class="l">Fill in the details below to get started.</p>
       <p class="l">Full Name</p>
       <input type="text" placeholder="       Enter your full name" class="b">
       <p class="l">Email Address</p>
       <input type="email" placeholder="         Enter your email" class="b">
       <p class="l">Password</p>
       <input type="password" placeholder="Enter your password" class="b">
       <p class="l">Confirm Password</p>
       <input type="password" placeholder="Confirm your Password" class="b">
       <p class="l">Phone Number</p>
       <input type="tel" placeholder="        Enter your Phone Number" class="b"><br><br>
       <button class="c"> Sign Up</button><br>
       <p>Already have an account?<a href="">Login</a> </p>
       <a class="call">&#9990;</a>
       <a class="mail">&#9993;</a>
       <a class="p">&#9731;</a>
       <a class="con">&#9786;</a>
       <a class="cons">&#9786;</a>
    </div>
</body>
</html>
